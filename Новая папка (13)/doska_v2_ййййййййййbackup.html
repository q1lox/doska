<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Доска</title>
<style>
:root{--bg:#f4f5f7;--fg:#1f2430;--pn:#fff;--bd:#e0e3ea;--ac:#3d5afe}
[data-t=dark]{--bg:#15171c;--fg:#eceef3;--pn:#22252d;--bd:#363a44}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.p{position:fixed;background:var(--pn);border:1px solid var(--bd);border-radius:12px;box-shadow:0 3px 14px #0002;display:flex;gap:3px;padding:5px;align-items:center}
#tools{left:10px;top:50%;transform:translateY(-50%);flex-direction:column}
#bar{bottom:10px;left:50%;transform:translateX(-50%);flex-wrap:wrap;justify-content:center;max-width:96vw}
#top{top:10px;right:10px}
#brand{top:10px;left:10px;font-weight:700;padding:9px 14px;font-size:15px}
button{width:38px;height:38px;border:0;border-radius:9px;background:transparent;color:inherit;font-size:18px;cursor:pointer}
button:hover{background:var(--bd)}
button.on{background:var(--ac);color:#fff}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--pn);box-shadow:0 0 0 1px var(--bd);margin:0 2px}
.sw.on{box-shadow:0 0 0 2px var(--ac)}
#zl{width:56px;font-size:13px}
input[type=range]{width:90px;accent-color:var(--ac)}
.zb{width:30px}.zb i{display:block;border-radius:50%;background:currentColor;margin:auto}
#sb{top:62px;left:50%;transform:translateX(-50%);display:none}
.sep{width:1px;height:24px;background:var(--bd);margin:0 4px}
#ta{position:fixed;display:none;margin:0;padding:0;border:0;outline:1px dashed var(--ac);background:transparent;resize:none;line-height:1.25;font-family:system-ui,sans-serif;overflow:hidden;-webkit-user-select:text;user-select:text}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none}
#lobby{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.card{width:360px;max-width:100%;background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:26px;box-shadow:0 8px 30px #0002;display:flex;flex-direction:column;gap:12px}
.card h1{margin:0;font-size:26px}.card .sub{margin:-6px 0 4px;opacity:.65}
.card label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.card input{height:40px;border:1px solid var(--bd);border-radius:9px;padding:0 12px;font-size:15px;background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text}
#lobby button{width:auto;height:42px;font-size:15px}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:11px;padding:4px}.tabs button{flex:1;height:36px}
#lb{background:var(--ac);color:#fff;font-weight:600}#ls{font-size:13px;opacity:.7;height:34px}
#le{min-height:18px;color:#e03131;font-size:13px}.note{font-size:12px;opacity:.55;line-height:1.4}
.nt{display:none}body.net .nt{display:inline-flex;align-items:center}
#usr{font-size:13px;padding:0 8px}#st{width:10px;height:10px;border-radius:50%;background:#2f9e44;margin:0 6px}
@media(max-width:600px){#brand{display:none}button{width:34px;height:34px}}
</style></head><body>
<canvas id="cv"></canvas>
<div class="p" id="brand">Доска</div>
<div class="p" id="tools"></div>
<div class="p" id="top">
<button id="th" title="Тема">🌙</button><button id="png" title="Скачать картинкой (PNG)">⬇️</button><button id="sv" title="Сохранить в файл">💾</button><button id="op" title="Открыть файл доски">📂</button><button id="cl" title="Очистить всё">🗑</button><span class="nt"><span id="usr"></span><span id="st"></span><button id="inv" title="Скопировать ссылку на доску">🔗</button><button id="ex" title="Выйти с доски">🚪</button></span></div>
<div class="p" id="bar">
<span id="sws"></span><span class="sep"></span>
<span id="sz"></span><input type="range" id="lw" min="1" max="40" value="4" title="Размер: от тонкого к толстому (для ручки, фигур, текста, ластика)">
<span class="sep"></span>
<button id="un" title="Отменить (Ctrl+Z)">↩️</button><button id="re" title="Повторить (Ctrl+Y)">↪️</button>
<span class="sep"></span>
<button id="zo" title="Отдалить">−</button><button id="zl" title="Масштаб 100%">100%</button><button id="zi" title="Приблизить">+</button><button id="ft" title="Показать всё">⤢</button>
</div>
<div class="p" id="sb"><button id="rl" title="Повернуть влево на 90°">⟲</button><button id="rr" title="Повернуть вправо на 90°">⟳</button><button id="fx" title="Отразить слева направо">⇋</button><button id="fy" title="Отразить сверху вниз">⇅</button><span class="sep"></span><button id="sd" title="Дублировать (Ctrl+D)">⧉</button><button id="sx" title="Удалить (Delete)">🗑</button></div>
<textarea id="ta" spellcheck="false"></textarea>
<input type="file" id="file" accept="image/*" multiple hidden><input type="file" id="jf" accept=".json" hidden>
<div id="toast"></div>
<div id="lobby"><div class="card"><h1>Доска</h1><p class="sub">Рисуй и учись вместе</p>
<div class="tabs"><button class="tb on" data-m="c">Создать доску</button><button class="tb" data-m="j">Войти на доску</button></div>
<label>Твоё имя<input id="ln" maxlength="20" autocomplete="off"></label>
<label>Название доски<input id="lr" maxlength="30" autocomplete="off"></label>
<label>Пароль<input id="lp" type="password" maxlength="40" autocomplete="off"></label>
<button id="lb">Создать доску</button><div id="le"></div>
<button id="ls">Работать одному, без интернета</button>
<div class="note">Доска хранится у того, кто её создал, — он должен оставаться на странице. Остальные заходят по названию и паролю.</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d'),ta=$('#ta');
let objs=[],cam={x:0,y:0,z:1},tool='sel',color='auto',lw=4,sel=new Set(),hist=[[]],fut=[],dirty=1,dark=false,dot='#cdd1da',eo=null,st=null,space=0,pz=null,svT;
let net=null,lastS=0,lastC=0,mp=null;const shadow=new Map(),cursors=new Map(),P=new Map(),RS=['note','img','rect','ell'];
const COLORS=['auto','#e03131','#f08c00','#2f9e44','#1971c2','#7048e8','#e64980','#868e96'],NOTE=['#fff3a3','#ffd6e0','#c9f0d4','#cfe4ff'];
const TOOLS=[['sel','↖','Выбор (V)'],['hand','✋','Рука — двигать доску (H или пробел)'],['pen','✏️','Карандаш (P)'],['hl','🖍','Маркер (M)'],['er','🧽','Ластик (E)'],['text','T','Текст (T)'],['note','🗒','Стикер (N)'],['rect','▭','Прямоугольник (R)'],['ell','◯','Эллипс (O)'],['line','╱','Линия (L)'],['arrow','➜','Стрелка (A)'],['img','🖼','Картинка (I, Ctrl+V, перетащить файл)']];
const KEYS={v:'sel',h:'hand',p:'pen',m:'hl',e:'er',t:'text',n:'note',r:'rect',o:'ell',l:'line',a:'arrow'};
const CUR={sel:'default',hand:'grab',pen:'crosshair',hl:'crosshair',er:'cell',text:'text',note:'copy',rect:'crosshair',ell:'crosshair',line:'crosshair',arrow:'crosshair'};
const fg=()=>dark?'#eceef3':'#1f2430',col=c=>c==='auto'?fg():c;
const w2s=(x,y)=>[x*cam.z+cam.x,y*cam.z+cam.y],s2w=(x,y)=>[(x-cam.x)/cam.z,(y-cam.y)/cam.z],uid=()=>Math.random().toString(36).slice(2,9);
const pos=e=>s2w(e.clientX,e.clientY);

// ---------- UI ----------
TOOLS.forEach(([k,ic,t])=>{const b=document.createElement('button');b.textContent=ic;b.title=t;b.dataset.k=k;b.onclick=()=>k=='img'?$('#file').click():setTool(k);$('#tools').append(b)});
COLORS.forEach(c=>{const b=document.createElement('button');b.className='sw'+(c==color?' on':'');b.style.background=c=='auto'?'linear-gradient(135deg,#1f2430 50%,#fff 50%)':c;b.onclick=()=>{color=c;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x==b));let ch=0;sel.forEach(o=>{if(['pen','rect','ell','line','arrow','text'].includes(o.t)){o.c=c;ch=1}});if(ch)commit()};$('#sws').append(b)});
function setTool(t){tool=t;document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.k==t));cv.style.cursor=CUR[t]||'default'}
setTool('sel');
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,2200)}
function setTheme(d){dark=d;document.documentElement.dataset.t=d?'dark':'';dot=d?'#343842':'#cdd1da';$('#th').textContent=d?'☀️':'🌙';dirty=1}
$('#th').onclick=()=>{setTheme(!dark);save()};
const tfs=()=>Math.round(12+lw*3),nfs=()=>Math.round(14+lw*1.5);
function setSize(v){lw=v;$('#lw').value=v;document.querySelectorAll('.zb').forEach(b=>b.classList.toggle('on',+b.dataset.v==v));let ch=0;
 sel.forEach(o=>{if(o.lw){o.lw=o.hl?v*4:v;ch=1}if(o.t=='text'){o.fs=tfs();ch=1}if(o.t=='note'){o.fs=nfs();ch=1}o._b=0});
 dirty=1;if(ch){clearTimeout(svT);svT=setTimeout(commit,400)}}
$('#lw').oninput=e=>setSize(+e.target.value);
[2,4,8,14,24].forEach(v=>{const b=document.createElement('button');b.className='zb'+(v==lw?' on':'');b.dataset.v=v;b.title='Размер '+v;b.innerHTML='<i style="width:'+(4+v*.7)+'px;height:'+(4+v*.7)+'px"></i>';b.onclick=()=>setSize(v);$('#sz').append(b)});
$('#un').onclick=undo;$('#re').onclick=redo;
$('#zi').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.25);$('#zo').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,.8);
$('#zl').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/cam.z);$('#ft').onclick=fit;
$('#png').onclick=exportPNG;$('#sv').onclick=()=>dl(URL.createObjectURL(new Blob([JSON.stringify(ser())])),'доска.json');
$('#op').onclick=()=>$('#jf').click();
$('#cl').onclick=()=>{if(objs.length&&confirm('Очистить всю доску? Это можно отменить Ctrl+Z.')){objs=[];sel.clear();commit()}};
$('#file').onchange=e=>{[...e.target.files].forEach((f,i)=>addImg(f,null,i*30));e.target.value=''};
$('#jf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);objs=d.o;objs.forEach(o=>o.t=='img'&&loadImg(o));sel.clear();commit();fit()}catch(x){toast('Не удалось открыть файл')}};r.readAsText(f);e.target.value=''};
function dl(u,n){const l=document.createElement('a');l.href=u;l.download=n;l.click()}

// ---------- geometry ----------
function loadImg(o){const i=new Image();i.onload=()=>dirty=1;i.src=o.src;o.el=i}
function tsize(o){g.font=o.fs+'px system-ui';const L=(o.s||' ').split('\n');return[Math.max(10,...L.map(l=>g.measureText(l).width)),L.length*o.fs*1.25]}
function bb(o){
 if(o.t=='pen'){if(!o._b){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of o.pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1])}o._b=[a,b,c,d]}const q=o._b;return[o.x+q[0],o.y+q[1],o.x+q[2],o.y+q[3]]}
 if(o.t=='line'||o.t=='arrow')return[Math.min(o.x,o.x2),Math.min(o.y,o.y2),Math.max(o.x,o.x2),Math.max(o.y,o.y2)];
 if(o.t=='text'){const m=tsize(o);return[o.x,o.y,o.x+m[0],o.y+m[1]]}
 return[Math.min(o.x,o.x+o.w),Math.min(o.y,o.y+o.h),Math.max(o.x,o.x+o.w),Math.max(o.y,o.y+o.h)]}
const cb=o=>{const b=bb(o);return[(b[0]+b[2])/2,(b[1]+b[3])/2]};
function abb(o){const b=bb(o);if(!o.r)return b;const c=cb(o),cs=Math.cos(o.r),sn=Math.sin(o.r);let a=1e9,t=1e9,m=-1e9,n=-1e9;for(const[x,y]of[[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]]]){const dx=x-c[0],dy=y-c[1],X=c[0]+dx*cs-dy*sn,Y=c[1]+dx*sn+dy*cs;a=Math.min(a,X);t=Math.min(t,Y);m=Math.max(m,X);n=Math.max(n,Y)}return[a,t,m,n]}
function tr(o,dx,dy){o.x+=dx;o.y+=dy;if(o.x2!=null){o.x2+=dx;o.y2+=dy}}
function hdl(){if(!sel.size)return null;
 if(sel.size==1){const o=[...sel][0],b=bb(o),c=cb(o),r=o.r||0,cs=Math.cos(r),sn=Math.sin(r),T=(dx,dy)=>[c[0]+dx*cs-dy*sn,c[1]+dx*sn+dy*cs],hw=(b[2]-b[0])/2,hh=(b[3]-b[1])/2;return{c,rot:T(0,-hh-30/cam.z),rs:RS.includes(o.t)?T(hw,hh):null}}
 let a=1e9,t=1e9,m=-1e9,n=-1e9;sel.forEach(o=>{const q=abb(o);a=Math.min(a,q[0]);t=Math.min(t,q[1]);m=Math.max(m,q[2]);n=Math.max(n,q[3])});
 return{c:[(a+m)/2,(t+n)/2],rot:[(a+m)/2,t-30/cam.z],rs:null,box:[a,t,m,n]}}
function rotSel(d,G){const cs=Math.cos(d),sn=Math.sin(d);sel.forEach(o=>{const c=cb(o),dx=c[0]-G[0],dy=c[1]-G[1];tr(o,G[0]+dx*cs-dy*sn-c[0],G[1]+dx*sn+dy*cs-c[1]);o.r=(o.r||0)+d});dirty=1}
function flipLocal(o,ax){
 if(o.t=='pen'){if(!o._b)bb(o);const q=o._b,m=ax=='x'?q[0]+q[2]:q[1]+q[3];o.pts=o.pts.map(p=>ax=='x'?[m-p[0],p[1]]:[p[0],m-p[1]]);o._b=0}
 else if(o.x2!=null){const b=bb(o);if(ax=='x'){const m=b[0]+b[2];o.x=m-o.x;o.x2=m-o.x2}else{const m=b[1]+b[3];o.y=m-o.y;o.y2=m-o.y2}}
 else if(o.t=='img'){if(ax=='x')o.fx=!o.fx;else o.fy=!o.fy}}
function flip(ax){const H=hdl();if(!H)return;sel.forEach(o=>{const c=cb(o);flipLocal(o,ax);o.r=-(o.r||0);o.v=(o.v||0)+1;const nc=ax=='x'?[2*H.c[0]-c[0],c[1]]:[c[0],2*H.c[1]-c[1]];tr(o,nc[0]-c[0],nc[1]-c[1])});commit()}
function dseg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function hit(o,x,y,r=6/cam.z){
 if(o.r){const c=cb(o),cs=Math.cos(-o.r),sn=Math.sin(-o.r),dx=x-c[0],dy=y-c[1];x=c[0]+dx*cs-dy*sn;y=c[1]+dx*sn+dy*cs}
 if(o.t=='pen'){const p=o.pts,px=x-o.x,py=y-o.y,k=o.lw/2+r;if(p.length==1)return Math.hypot(px-p[0][0],py-p[0][1])<k;for(let i=1;i<p.length;i++)if(dseg(px,py,p[i-1][0],p[i-1][1],p[i][0],p[i][1])<k)return 1;return 0}
 if(o.t=='line'||o.t=='arrow')return dseg(x,y,o.x,o.y,o.x2,o.y2)<o.lw/2+r;
 const b=bb(o);return x>=b[0]-r&&x<=b[2]+r&&y>=b[1]-r&&y<=b[3]+r}
function zoomAt(x,y,f){const nz=Math.max(.02,Math.min(8,cam.z*f));f=nz/cam.z;cam.x=x-(x-cam.x)*f;cam.y=y-(y-cam.y)*f;cam.z=nz;dirty=1;save()}
function allBox(){let a=1e9,b=1e9,c=-1e9,d=-1e9;objs.forEach(o=>{const q=abb(o);a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[2]);d=Math.max(d,q[3])});return[a,b,c,d]}
function fit(){if(!objs.length){cam={x:0,y:0,z:1}}else{const[a,b,c,d]=allBox(),z=Math.max(.02,Math.min(2,.85*Math.min(innerWidth/(c-a||1),innerHeight/(d-b||1))));cam.z=z;cam.x=innerWidth/2-(a+c)/2*z;cam.y=innerHeight/2-(b+d)/2*z}dirty=1;save()}

// ---------- rendering ----------
function wrap(s,mw,c){const out=[];for(const p of (s||'').split('\n')){let l='';for(const w of p.split(' ')){const t=l?l+' '+w:w;if(c.measureText(t).width>mw&&l){out.push(l);l=w}else l=t}out.push(l)}return out}
function drawObj(o,c=g){
 c.save();if(o.r){const q=cb(o);c.translate(q[0],q[1]);c.rotate(o.r);c.translate(-q[0],-q[1])}c.lineCap=c.lineJoin='round';c.strokeStyle=c.fillStyle=col(o.c);c.lineWidth=o.lw||2;
 if(o.t=='pen'){c.globalAlpha=o.hl?.35:1;if(o.hl)c.lineCap='butt';c.translate(o.x,o.y);c.beginPath();const p=o.pts;c.moveTo(p[0][0],p[0][1]);if(p.length==1)c.lineTo(p[0][0]+.01,p[0][1]);
  for(let i=1;i<p.length-1;i++)c.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);
  if(p.length>1)c.lineTo(p[p.length-1][0],p[p.length-1][1]);c.stroke()}
 else if(o.t=='rect'||o.t=='ell'){const b=bb(o);c.beginPath();if(o.t=='rect')c.roundRect(b[0],b[1],b[2]-b[0],b[3]-b[1],8);else c.ellipse((b[0]+b[2])/2,(b[1]+b[3])/2,(b[2]-b[0])/2,(b[3]-b[1])/2,0,0,7);c.globalAlpha=.1;c.fill();c.globalAlpha=1;c.stroke()}
 else if(o.t=='line'||o.t=='arrow'){c.beginPath();c.moveTo(o.x,o.y);c.lineTo(o.x2,o.y2);if(o.t=='arrow'){const a=Math.atan2(o.y2-o.y,o.x2-o.x),h=10+o.lw*2;for(const d of[-.45,.45]){c.moveTo(o.x2,o.y2);c.lineTo(o.x2-h*Math.cos(a+d),o.y2-h*Math.sin(a+d))}}c.stroke()}
 else if(o.t=='text'){if(!o.ed){c.font=o.fs+'px system-ui';c.textBaseline='top';o.s.split('\n').forEach((l,i)=>c.fillText(l,o.x,o.y+i*o.fs*1.25))}}
 else if(o.t=='note'){c.shadowColor='#0003';c.shadowBlur=10;c.fillStyle=o.c;c.beginPath();c.roundRect(o.x,o.y,o.w,o.h,6);c.fill();c.shadowBlur=0;
  if(!o.ed){c.fillStyle='#222';c.font=o.fs+'px system-ui';c.textBaseline='top';wrap(o.s,o.w-20,c).forEach((l,i)=>c.fillText(l,o.x+10,o.y+10+i*o.fs*1.25))}}
 else if(o.t=='img'){if(o.el&&o.el.complete&&o.el.naturalWidth){c.translate(o.x+o.w/2,o.y+o.h/2);c.scale(o.fx?-1:1,o.fy?-1:1);c.drawImage(o.el,-o.w/2,-o.h/2,o.w,o.h)}else{c.globalAlpha=.2;c.fillRect(o.x,o.y,o.w,o.h)}}
 c.restore()}
function draw(){
 dirty=0;const d=devicePixelRatio||1,W=innerWidth,H=innerHeight,z=cam.z;
 g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);
 let s=32;while(s*z<16)s*=2;g.fillStyle=dot;const r=Math.max(1.2,1.4*Math.min(z,1.5));
 for(let x=Math.floor(-cam.x/z/s)*s;x*z+cam.x<W;x+=s)for(let y=Math.floor(-cam.y/z/s)*s;y*z+cam.y<H;y+=s)g.fillRect(x*z+cam.x-r/2,y*z+cam.y-r/2,r,r);
